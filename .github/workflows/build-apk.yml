name: APK yig'ish
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketlarni o'rnatish
        run: npm install
      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#e2432a' --splashBackgroundColor '#e2432a' || echo "Ikonka yaratilmadi, standart ikonka qoladi"
          npx cap sync android
      - name: APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: uy-mashq-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

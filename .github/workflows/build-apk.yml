name: APK yig'ish
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imzo kaliti borligini tekshirish
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 secret qo'shilmagan. README.md dagi 'Imzo' bo'limini bajaring."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketlarni o'rnatish
        run: npm install
      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#e2432a' --splashBackgroundColor '#e2432a' || echo "Ikonka yaratilmadi, standart ikonka qoladi"
          npx cap sync android
      - name: Versiya raqami (har yig'ishda +1)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Doimiy kalit bilan imzolash
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 "$IN" aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out uy-mashq.apk aligned.apk
          $BT/apksigner verify --print-certs uy-mashq.apk | head -3
          rm ks.jks
      - uses: actions/upload-artifact@v4
        with:
          name: uy-mashq-apk-v1.0.${{ github.run_number }}
          path: uy-mashq.apk
